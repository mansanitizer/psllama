# Wan2.1 T2V 1.3B (Alibaba, Apache-2.0), per stable-diffusion.cpp docs: CFG 6,
# euler, flow shift 3, flash attention; defaults are the smallest sensible
# test (416x240, 9 frames, 20 steps); the reference is 832x480, 33 frames.
mode=video
diffusion_model=wan2.1_t2v_1.3B_fp16.safetensors
t5xxl=umt5-xxl-encoder-Q4_K_M.gguf
vae=wan_2.1_vae.safetensors
diffusion_flash_attn=1
# Keep the video model on the GPU; run the text encoder and VAE from disk so
# the VAE has room to decode.
params_backend=all=Vulkan0,te=disk,vae=disk
sample_method=euler
steps=20
cfg_scale=6.0
flow_shift=3.0
width=416
height=240
frames=9
fps=16
