# Wan2.2 TI2V 5B (Alibaba, Apache-2.0): text- or image-to-video, its own
# high-compression VAE; umt5 encoder shared with the wan2.1-t2v-1.3b folder.
mode=video
diffusion_model=Wan2.2-TI2V-5B-Q8_0.gguf
t5xxl=../wan2.1-t2v-1.3b/umt5-xxl-encoder-Q4_K_M.gguf
vae=wan2.2_vae.safetensors
diffusion_flash_attn=1
# Keep the video model on the GPU; run the text encoder and VAE from disk so
# the VAE has room to decode.
params_backend=all=Vulkan0,te=disk,vae=disk
sample_method=euler
steps=20
cfg_scale=6.0
flow_shift=3.0
width=480
height=256
frames=17
fps=24
