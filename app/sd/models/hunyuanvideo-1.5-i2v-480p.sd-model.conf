# HunyuanVideo 1.5 image-to-video 480p, CFG-distilled (Tencent Hunyuan
# Community License): Qwen2.5-VL 7B + byT5 GlyphXL text encoders, SigCLIP
# image encoder. CFG 1.0 (guidance is distilled in), flow shift 5 for 480p.
# Send init_image_b64 with the request. Defaults are a small first test.
mode=video
diffusion_model=hunyuanvideo1.5_480p_i2v_cfg_distilled-Q4_K_M.gguf
llm=Qwen2.5-VL-7B-Instruct.Q4_K_M.gguf
t5xxl=byt5_small_glyphxl_fp16.safetensors
clip_vision=sigclip_vision_patch14_384.safetensors
vae=hunyuanvideo15_vae_fp16.safetensors
diffusion_flash_attn=1
# 11.7 GB of weights do not fit beside the VAE's working memory: keep the
# video model on the GPU, run the encoders and VAE from disk.
params_backend=all=Vulkan0,te=disk,clip_vision=disk,vae=disk
sample_method=euler
steps=20
cfg_scale=1.0
flow_shift=5.0
width=416
height=240
frames=17
fps=24
